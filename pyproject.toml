[project]
name = "dreamer"
version = "0.1.0"
description = "Dreamer"
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    "accelerate",
    "gymnasium",
    "numpy>1.21.6",
    "pytest",
    "pytest-asyncio",
    "python-dotenv",
    "matplotlib",
    "ipywidgets",
    "torch",
    "torchvision",
    "einops",
    "tensorboard",
    "opencv-python>=4.10",
    "dm_control",
    "tqdm>=4.68.3",
    "plotly>=6.9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]


[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.17",
]
